<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>经济监管工具 - 离线</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1d1d1f;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #86868b;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 100px;
      background: #fef2f2;
      color: #dc2626;
      font-size: 13px;
      font-weight: 600;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dc2626;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .retry-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 14px 24px;
      border: none;
      border-radius: 14px;
      background: #3b82f6;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover { background: #2563eb; }
    .retry-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>当前处于离线状态</h1>
    <p>无法连接到服务器，<br/>请检查您的网络连接后重试。</p>
    <div class="status">
      <span class="dot"></span>
      网络已断开
    </div>
    <button class="retry-btn" onclick="location.reload()">重新连接</button>
    <p style="font-size:12px;margin-top:16px;margin-bottom:0;color:#a1a1a6;">
      提示：恢复联网后数据将自动同步
    </p>
  </div>

  <script>
    // 定时检测网络恢复
    setInterval(() => {
      if (navigator.onLine) {
        location.reload();
      }
    }, 3000);
  </script>
</body>
</html>
